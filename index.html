<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calculator AI</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{
  min-height:100vh;background:#f2f3f7;
  display:flex;justify-content:center;padding:20px
}
.app{width:min(1000px,100%);display:grid;grid-template-columns:430px 1fr;gap:18px}
.card{background:white;border-radius:24px;padding:18px;box-shadow:0 10px 35px #0001}
h1{font-size:22px;margin-bottom:15px}
.display{background:#eef0f5;border-radius:18px;padding:15px;text-align:right;margin-bottom:10px}
.expression{height:25px;color:#777;overflow:auto}
.result{font-size:38px;font-weight:bold;word-break:break-all}
.memory,.buttons,.scientific{display:grid;gap:8px}
.memory{grid-template-columns:repeat(4,1fr);margin-bottom:8px}
.memory button{height:38px;font-size:13px}
.buttons{grid-template-columns:repeat(4,1fr)}
button{
  border:0;border-radius:14px;height:58px;
  background:#eef0f4;font-size:19px;font-weight:bold;
  cursor:pointer
}
button:active{transform:scale(.96)}
.op{background:#e0e7ff}
.clear{background:#ffdede}
.equal{background:#222;color:white}
.zero{grid-column:span 2}
.tools{display:flex;gap:8px;margin-top:8px}
.tools button{height:42px;flex:1;font-size:13px}
.mode{display:flex;gap:8px;margin-top:10px}
.mode button{height:40px;flex:1;font-size:14px}
.scientific{
  display:none;grid-template-columns:repeat(5,1fr);
  margin-top:8px
}
.scientific.show{display:grid}
.scientific button{height:43px;font-size:13px}
.ai{
  background:#f5f6f9;border-radius:17px;padding:14px;margin-top:12px
}
.ai h2{font-size:17px;margin-bottom:5px}
.ai p{font-size:13px;color:#777;margin-bottom:9px}
.airow{display:flex;gap:7px}
.airow input{
  flex:1;min-width:0;border:1px solid #ddd;
  border-radius:11px;padding:11px;font-size:14px
}
.airow button{height:44px;background:#222;color:white;padding:0 15px;font-size:14px}
.answer{margin-top:10px;line-height:1.5;font-size:14px}
.history-head{display:flex;justify-content:space-between;margin-bottom:12px}
.history{max-height:600px;overflow:auto}
.item{background:#f5f6f9;padding:11px;border-radius:12px;margin-bottom:8px}
.item .exp{color:#777;font-size:13px}
.item .ans{font-size:18px;font-weight:bold}
@media(max-width:750px){
  .app{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="app">

<!-- CALCULATOR -->
<div class="card">

<h1>🤖 Calculator AI</h1>

<div class="display">
  <div class="expression" id="expression"></div>
  <div class="result" id="result">0</div>
</div>

<!-- MEMORY -->
<div class="memory">
  <button onclick="mc()">MC</button>
  <button onclick="mr()">MR</button>
  <button onclick="mplus()">M+</button>
  <button onclick="mminus()">M−</button>
</div>

<!-- BASIC -->
<div class="buttons">

<button class="clear" onclick="clearCalc()">AC</button>
<button onclick="backspace()">⌫</button>
<button onclick="percent()">%</button>
<button class="op" onclick="operator('/')">÷</button>

<button onclick="number('7')">7</button>
<button onclick="number('8')">8</button>
<button onclick="number('9')">9</button>
<button class="op" onclick="operator('*')">×</button>

<button onclick="number('4')">4</button>
<button onclick="number('5')">5</button>
<button onclick="number('6')">6</button>
<button class="op" onclick="operator('-')">−</button>

<button onclick="number('1')">1</button>
<button onclick="number('2')">2</button>
<button onclick="number('3')">3</button>
<button class="op" onclick="operator('+')">+</button>

<button class="zero" onclick="number('0')">0</button>
<button onclick="decimal()">.</button>
<button class="equal" onclick="equals()">=</button>

</div>

<!-- EXTRA -->
<div class="tools">
<button onclick="sign()">±</button>
<button onclick="scientific('square')">x²</button>
<button onclick="scientific('sqrt')">√x</button>
<button onclick="clearHistory()">Clear history</button>
</div>

<!-- SCIENTIFIC MODE -->
<div class="mode">
<button onclick="toggleScientific()">Scientific</button>
<button onclick="toggleAngle()" id="angle">DEG</button>
</div>

<div class="scientific" id="scientific">

<button onclick="scientific('sin')">sin</button>
<button onclick="scientific('cos')">cos</button>
<button onclick="scientific('tan')">tan</button>
<button onclick="scientific('asin')">sin⁻¹</button>
<button onclick="scientific('acos')">cos⁻¹</button>

<button onclick="scientific('atan')">tan⁻¹</button>
<button onclick="scientific('log')">log</button>
<button onclick="scientific('ln')">ln</button>
<button onclick="scientific('exp')">eˣ</button>
<button onclick="scientific('pow10')">10ˣ</button>

<button onclick="scientific('pi')">π</button>
<button onclick="scientific('e')">e</button>
<button onclick="scientific('factorial')">x!</button>
<button onclick="scientific('inverse')">1/x</button>
<button onclick="scientific('abs')">|x|</button>

<button onclick="scientific('cube')">x³</button>
<button onclick="scientific('cuberoot')">∛x</button>
<button onclick="scientific('random')">Rand</button>

</div>

<!-- AI -->
<div class="ai">

<h2>🧠 AI Math Assistant</h2>

<p>Ask a math question.</p>

<div class="airow">

<input
 id="question"
 placeholder="Example: What is 25% of 480?"
>

<button onclick="askAI()">Ask</button>

</div>

<div class="answer" id="answer">
AI answer will appear here.
</div>

</div>

</div>


<!-- HISTORY -->
<div class="card">

<div class="history-head">
<h2>Calculation History</h2>
<span id="count">0</span>
</div>

<div class="history" id="history">
No calculations yet.
</div>

</div>

</div>


<script>

let current="0";
let previous=null;
let op=null;
let waiting=false;
let memory=0;
let angle="DEG";
let justCalculated=false;

let history=JSON.parse(
 localStorage.getItem("calcAIHistory")||"[]"
);

const result=document.getElementById("result");
const expression=document.getElementById("expression");


function symbol(x){
 return {
  "+":"+",
  "-":"−",
  "*":"×",
  "/":"÷"
 }[x]||x;
}


function update(){

 result.textContent=current;

 expression.textContent=
  previous!==null&&op
  ? previous+" "+symbol(op)
  :"";

 renderHistory();
}


function number(n){

 if(current==="Error") clearCalc();

 if(waiting||justCalculated){
  current=n;
  waiting=false;
  justCalculated=false;
 }else{
  current=current==="0"?n:current+n;
 }

 update();
}


function decimal(){

 if(waiting||justCalculated){
  current="0.";
  waiting=false;
  justCalculated=false;
 }else if(!current.includes(".")){
  current+=".";
 }

 update();
}


function operator(x){

 if(current==="Error")return;

 if(previous!==null&&op&&!waiting){
  equals(false);
 }

 previous=parseFloat(current);
 op=x;
 waiting=true;
 justCalculated=false;

 update();
}


function equals(save=true){

 if(previous===null||op===null)return;

 let a=previous;
 let b=parseFloat(current);
 let ans;

 if(op==="+")ans=a+b;
 if(op==="-")ans=a-b;
 if(op==="*")ans=a*b;

 if(op==="/"){
  if(b===0){
   current="Error";
   previous=null;
   op=null;
   update();
   return;
  }
  ans=a/b;
 }

 current=format(ans);

 if(save){

  history.unshift({
   exp:`${a} ${symbol(op)} ${b}`,
   ans:current
  });

  history=history.slice(0,100);

  localStorage.setItem(
   "calcAIHistory",
   JSON.stringify(history)
  );
 }

 previous=null;
 op=null;
 waiting=false;
 justCalculated=true;

 update();
}


function format(n){
 return Number(n.toFixed(12)).toString();
}


function clearCalc(){

 current="0";
 previous=null;
 op=null;
 waiting=false;
 justCalculated=false;

 update();
}


function backspace(){

 if(current.length<=1||current==="Error")
  current="0";
 else
  current=current.slice(0,-1);

 update();
}


function percent(){

 current=format(parseFloat(current)/100);
 update();
}


function sign(){

 if(current!=="0"&&current!=="Error")
  current=format(parseFloat(current)*-1);

 update();
}


/* MEMORY */

function mc(){
 memory=0;
}

function mr(){
 current=format(memory);
 update();
}

function mplus(){
 memory+=parseFloat(current)||0;
}

function mminus(){
 memory-=parseFloat(current)||0;
}


/* HISTORY */

function renderHistory(){

 document.getElementById("count").textContent=
  history.length;

 const box=document.getElementById("history");

 if(!history.length){
  box.textContent="No calculations yet.";
  return;
 }

 box.innerHTML=history.map((h,i)=>`
  <div class="item" onclick="useHistory(${i})">
   <div class="exp">${h.exp}</div>
   <div class="ans">= ${h.ans}</div>
  </div>
 `).join("");
}


function useHistory(i){

 current=history[i].ans;
 waiting=false;

 update();
}


function clearHistory(){

 history=[];

 localStorage.removeItem(
  "calcAIHistory"
 );

 renderHistory();
}


/* SCIENTIFIC */

function toggleScientific(){

 document
  .getElementById("scientific")
  .classList.toggle("show");

}


function toggleAngle(){

 angle=angle==="DEG"?"RAD":"DEG";

 document.getElementById("angle").textContent=angle;
}


function radians(x){

 return angle==="DEG"
  ? x*Math.PI/180
  : x;
}


function factorial(n){

 if(n<0||!Number.isInteger(n)||n>170)
  return null;

 let r=1;

 for(let i=2;i<=n;i++)
  r*=i;

 return r;
}


function scientific(type){

 let n=parseFloat(current);
 let ans;

 switch(type){

  case"sin":
   ans=Math.sin(radians(n));
   break;

  case"cos":
   ans=Math.cos(radians(n));
   break;

  case"tan":
   ans=Math.tan(radians(n));
   break;

  case"asin":
   ans=Math.asin(n);
   if(angle==="DEG")ans*=180/Math.PI;
   break;

  case"acos":
   ans=Math.acos(n);
   if(angle==="DEG")ans*=180/Math.PI;
   break;

  case"atan":
   ans=Math.atan(n);
   if(angle==="DEG")ans*=180/Math.PI;
   break;

  case"log":
   ans=Math.log10(n);
   break;

  case"ln":
   ans=Math.log(n);
   break;

  case"exp":
   ans=Math.exp(n);
   break;

  case"pow10":
   ans=Math.pow(10,n);
   break;

  case"pi":
   ans=Math.PI;
   break;

  case"e":
   ans=Math.E;
   break;

  case"factorial":
   ans=factorial(n);
   break;

  case"inverse":
   ans=1/n;
   break;

  case"abs":
   ans=Math.abs(n);
   break;

  case"square":
   ans=n*n;
   break;

  case"cube":
   ans=n*n*n;
   break;

  case"sqrt":
   ans=Math.sqrt(n);
   break;

  case"cuberoot":
   ans=Math.cbrt(n);
   break;

  case"random":
   ans=Math.random();
   break;
 }

 if(!Number.isFinite(ans)){
  current="Error";
 }else{
  current=format(ans);
 }

 waiting=false;
 justCalculated=true;

 update();
}


/* AI MATH ASSISTANT */

function askAI(){

 const q=
  document.getElementById("question")
  .value.trim();

 const out=
  document.getElementById("answer");

 if(!q){
  out.textContent="Please enter a question.";
  return;
 }

 let m;

 /* percentage */

 m=q.match(
  /(-?\d+(?:\.\d+)?)\s*%\s*of\s*(-?\d+(?:\.\d+)?)/i
 );

 if(m){

  let ans=
   parseFloat(m[1])/100*
   parseFloat(m[2]);

  out.textContent=
   `${m[1]}% of ${m[2]} = ${ans}`;

  return;
 }


 /* square root */

 m=q.match(
  /(?:sqrt|square root of)\s*(-?\d+(?:\.\d+)?)/i
 );

 if(m){

  let n=parseFloat(m[1]);

  out.textContent=
   n<0
   ?"Invalid square root."
   :`√${n} = ${Math.sqrt(n)}`;

  return;
 }


 /* factorial */

 m=q.match(
  /(?:factorial of|factorial)\s*(\d+)/i
 );

 if(m){

  let n=parseInt(m[1]);
  let ans=factorial(n);

  out.textContent=
   ans===null
   ?"Invalid factorial."
   :`${n}! = ${ans}`;

  return;
 }


 /* basic math */

 m=q.match(
  /(-?\d+(?:\.\d+)?)\s*(\+|minus|subtract|-|\*|x|×|divide by|÷|\/)\s*(-?\d+(?:\.\d+)?)/i
 );

 if(m){

  let a=parseFloat(m[1]);
  let b=parseFloat(m[3]);
  let o=m[2].toLowerCase();
  let ans;

  if(o==="+")
   ans=a+b;

  else if(
   ["minus","subtract","-"].includes(o)
  )
   ans=a-b;

  else if(
   ["*","x","×"].includes(o)
  )
   ans=a*b;

  else{

   if(b===0){
    out.textContent="Cannot divide by zero.";
    return;
   }

   ans=a/b;
  }

  out.textContent=
   `${a} ${m[2]} ${b} = ${ans}`;

  return;
 }


 out.textContent=
  "I can solve common math questions such as percentages, square roots, factorials, addition, subtraction, multiplication and division.";
}


/* ENTER = */

document.addEventListener(
 "keydown",
 function(e){

  if(
   document.activeElement.id==="question"
  ){

   if(e.key==="Enter")
    askAI();

   return;
  }

  if(e.key>="0"&&e.key<="9")
   number(e.key);

  else if(e.key==".")
   decimal();

  else if(
   ["+","-","*","/"].includes(e.key)
  )
   operator(e.key);

  else if(
   e.key==="Enter"||
   e.key==="="
  )
   equals();

  else if(e.key==="Backspace")
   backspace();

  else if(e.key==="Escape")
   clearCalc();

  else if(e.key==="%")
   percent();

 }
);


update();

</script>

</body>
</html>
